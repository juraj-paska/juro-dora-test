apiVersion: apps/v1
kind: Deployment
metadata:
  name: juro-dora-test
  namespace: juro-dora-test
  labels:
    app: juro-dora-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juro-dora-test
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: juro-dora-test
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: juro-dora-test
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/app /tmp/site-packages
              cat > /tmp/app/requirements.txt <<'EOF'
              solarwinds-apm
              EOF
              cat > /tmp/app/main.py <<'EOF'
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json
              import os

              PORT = int(os.environ.get("PORT", 8080))


              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          body = json.dumps({"status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          body = json.dumps({"message": "Hello from Python webserver Juro Dora Test"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)

                  def log_message(self, format, *args):
                      print(f"{self.address_string()} - {format % args}")


              if __name__ == "__main__":
                  server = HTTPServer(("0.0.0.0", PORT), Handler)
                  print(f"Listening on port {PORT}")
                  server.serve_forever()
              EOF
              pip install --target /tmp/site-packages -r /tmp/app/requirements.txt
              pip install --target /tmp/site-packages solarwinds-apm
              PYTHONPATH=/tmp/site-packages /tmp/site-packages/bin/opentelemetry-bootstrap --action=requirements > /tmp/otel-requirements.txt
              pip install --target /tmp/site-packages -r /tmp/otel-requirements.txt
              exec /tmp/site-packages/bin/opentelemetry-instrument python /tmp/app/main.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: SW_APM_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: juro-dora-test-apm
                  key: SW_APM_SERVICE_KEY
            - name: SW_APM_COLLECTOR
              value: "apm.collector.na-01.st-ssp.solarwinds.com"
            - name: PYTHONPATH
              value: "/tmp/site-packages"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
        - name: traffic-generator
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                curl -sS -o /dev/null -w "traffic-generator: GET / -> %{http_code}\n" http://localhost:8080/ || true
                sleep 60
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
