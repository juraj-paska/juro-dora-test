apiVersion: apps/v1
kind: Deployment
metadata:
  name: juro-dora-test
  namespace: juro-dora-test
  labels:
    app: juro-dora-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juro-dora-test
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        deploy/redeploy-id: id-2
      labels:
        app: juro-dora-test
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: juro-dora-test
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/app /tmp/site-packages
              cat > /tmp/app/requirements.txt <<'EOF'
              flask
              solarwinds-apm
              EOF
              cat > /tmp/app/main.py <<'EOF'
              import json
              import os

              from flask import Flask, Response

              PORT = int(os.environ.get("PORT", 8080))

              app = Flask(__name__)


              def _json(payload):
                  # Use json.dumps (not jsonify) to keep the exact "key": "value"
                  # spacing the CI smoke tests grep for.
                  return Response(json.dumps(payload), mimetype="application/json")


              @app.route("/healthz")
              def healthz():
                  return _json({"status": "ok"})


              @app.route("/")
              def index():
                  # Optional failure injection for DORA change-failure simulation:
                  # when FAIL_REQUESTS is truthy, app routes return 500 while
                  # /healthz stays OK, so the pod stays Ready but requests fail.
                  if os.environ.get("FAIL_REQUESTS", "").lower() in ("1", "true", "yes"):
                      return _json({"error": "Simulated failure"}), 500
                  return _json({"message": "Hello from Python webserver Juro Dora Test"})


              if __name__ == "__main__":
                  print(f"Listening on port {PORT}")
                  app.run(host="0.0.0.0", port=PORT)
              EOF
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --no-cache-dir -r /tmp/app/requirements.txt
              /tmp/venv/bin/opentelemetry-bootstrap --action=install
              exec /tmp/venv/bin/opentelemetry-instrument /tmp/venv/bin/python /tmp/app/main.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: SW_APM_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: juro-dora-test-apm
                  key: SW_APM_SERVICE_KEY
            - name: SW_APM_COLLECTOR
              value: "apm.collector.na-01.st-ssp.solarwinds.com"
            # Set to "true" to make GET / return HTTP 500 (DORA change-failure
            # simulation). /healthz stays 200 so the pod remains Ready.
            - name: FAIL_REQUESTS
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
        - name: traffic-generator
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                curl -sS -o /dev/null -w "traffic-generator: GET / -> %{http_code}\n" http://localhost:8080/ || true
                sleep 63
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
