apiVersion: apps/v1
kind: Deployment
metadata:
  name: juro-dora-test
  namespace: juro-dora-test
  labels:
    app: juro-dora-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: juro-dora-test
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: juro-dora-test
    spec:
      volumes:
        - name: app-code
          configMap:
            name: juro-dora-test
        - name: site-packages
          emptyDir: {}
      initContainers:
        - name: install-deps
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --target /site-packages -r /app/requirements.txt
              pip install --target /site-packages solarwinds-apm
              opentelemetry-bootstrap --action=install --target-dir /site-packages
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: site-packages
              mountPath: /site-packages
      containers:
        - name: juro-dora-test
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["opentelemetry-instrument", "python", "/app/main.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: SW_APM_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: juro-dora-test-apm
                  key: SW_APM_SERVICE_KEY
            - name: SW_APM_COLLECTOR
              value: "apm.collector.na-01.st-ssp.solarwinds.com"
            - name: PYTHONPATH
              value: "/site-packages"
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: site-packages
              mountPath: /site-packages
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
